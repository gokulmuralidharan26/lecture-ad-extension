<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lecture Notes Companion</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Lecture Notes Companion</h1>
  <p class="hint">
    Upload a PDF of your lecture slides/notes. Export PowerPoint files to PDF
    first (File → Export → PDF) — this MVP reads PDF text only.
  </p>

  <input type="file" id="file-input" accept="application/pdf" />
  <div id="status"></div>

  <div id="chunk-preview"></div>

  <script src="lib/pdf.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
